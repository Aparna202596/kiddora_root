version: "3.9"

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: kiddora_db
      POSTGRES_USER: kiddora
      POSTGRES_PASSWORD: success
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiddora -d kiddora_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build: .
    # ports: - "8000:8000"   # ← COMMENT OUT IN PRODUCTION (Nginx handles public traffic)
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      REDIS_URL: "redis://redis:6379/1"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - static_volume:/app/staticfiles
      # - .:/app          # ← COMMENT OUT IN PRODUCTION (no hot-reload)
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"          # ← Public HTTP (add 443:443 for HTTPS later)
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/static
    depends_on:
      - web
    restart: unless-stopped

volumes:
  postgres_data:
  static_volume: