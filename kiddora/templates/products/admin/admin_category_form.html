{% extends "base_admin.html" %}

{% block content %}
<style>
.form-box {
    width: 50%;
    margin: 40px auto;
    padding: 25px;
    background: #f8f9fa;
    border-radius: 16px; /* curved edges */
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

h2 {
    text-align: center; /* center heading */
    margin-bottom: 20px;
}

label {
    display: block;
    margin-top: 12px;
    font-weight: 500;
}

input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-top: 6px;
    border-radius: 6px;
    border: 1px solid #ccc;
}

.form-actions {
    display: flex;
    justify-content: space-between; /* left & right */
    margin-top: 25px;
}

.btn-custom {
    padding: 8px 18px;
    background: #f06292;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    text-align: center;
}

.btn-custom:hover {
    background: #f42f71;
}
/* ── MESSAGES ── */
    .messages { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .message {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    }
    .message button {
        background: none; border: none; cursor: pointer;
        font-size: 18px; padding: 0 0 0 10px; color: inherit; opacity: 0.7;
    }
    .message button:hover { opacity: 1; }
    .message.success { background: #e6f9f0; color: #1a7a4a; border: 1px solid #a3e0c1; }
    .message.error   { background: #fdecea; color: #c0392b; border: 1px solid #f5a9a4; }
    .message.warning { background: #fff8e1; color: #b07d00; border: 1px solid #ffe082; }
    .message.info    { background: #e8f4fd; color: #1565c0; border: 1px solid #90caf9; }
</style>

<div class="form-box">
    <h2>{% if category %}Edit Category{% else %}Add Category{% endif %}</h2>
    {% if messages %}
            <div class="messages" id="msgContainer">
                {% for message in messages %}
                <div class="message {{ message.tags }}">
                    <span>{{ message }}</span>
                    <button type="button" onclick="this.parentElement.remove()">×</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
    <form method="post">
        {% csrf_token %}

        <label>Category Name</label>

        <input type="text"
                name="category_name"
                value="{{ category.category_name|default:'' }}"
                required>

        <label>
            <input type="checkbox" name="is_active"
                    {% if category and category.is_active %}checked{% endif %}>
            Active
        </label>

        <div class="form-actions">

            <button type="submit" class="btn-custom">Save</button>

            <a href="{% url 'products:admin_category_list' %}" class="btn-custom">Cancel</a>
            
    </form>
</div>
<script>
/* ── Auto-dismiss messages after 15 seconds ── */
    const msgContainer = document.getElementById("msgContainer");
    if (msgContainer) {
        setTimeout(() => {
            msgContainer.querySelectorAll(".message").forEach(msg => {
                msg.style.transition = "opacity 0.5s";
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 500);
            });
        }, 15000);
    }
</script>
{% endblock %}
