{% extends "base_profile.html" %}
{% load static %}
{% block content %}

<style>
.profile-container {
    max-width: 500px;
    margin: 40px auto;
    background: #fff;
    padding: 30px 40px;
    border-radius: 12px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.1);
    font-family: 'Arial', sans-serif;
}
.profile-container h2 {
    text-align: center;
    margin-bottom: 25px;
    font-size: 26px;
    color: #333;
}
.profile-container form {
    display: flex;
    flex-direction: column;
    gap: 18px;
}
.profile-container input[type="text"],
.profile-container input[type="file"],
.profile-container input[type="tel"] {
    padding: 12px 14px;
    border-radius: 8px;
    border: 1px solid #ccc;
    font-size: 15px;
    width: 100%;
    box-sizing: border-box;
}
.profile-container input[type="file"] {
    padding: 6px 10px;
}
.profile-container button {
    padding: 12px 0;
    border: none;
    border-radius: 8px;
    background-color: #f06292;
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.3s ease;
}
.profile-container button:hover {
    background-color: #e91e63;
}
.profile-image-preview {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    object-fit: cover;
    margin: 0 auto 20px auto;
    display: block;
    border: 2px solid #ddd;
}
/* ── MESSAGES ── */
    .messages { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
    .message {
        display: flex; justify-content: space-between; align-items: center;
        padding: 10px 14px; border-radius: 8px; font-size: 14px; font-weight: 500;
    }
    .message button {
        background: none; border: none; cursor: pointer;
        font-size: 18px; padding: 0 0 0 10px; color: inherit; opacity: 0.7;
    }
    .message button:hover { opacity: 1; }
    .message.success { background: #e6f9f0; color: #1a7a4a; border: 1px solid #a3e0c1; }
    .message.error   { background: #fdecea; color: #c0392b; border: 1px solid #f5a9a4; }
    .message.warning { background: #fff8e1; color: #b07d00; border: 1px solid #ffe082; }
    .message.info    { background: #e8f4fd; color: #1565c0; border: 1px solid #90caf9; }
</style>
<div class="profile-container">
    <h2>Edit Profile</h2>
    {% if messages %}
            <div class="messages" id="msgContainer">
                {% for message in messages %}
                <div class="message {{ message.tags }}">
                    <span>{{ message }}</span>
                    <button type="button" onclick="this.parentElement.remove()">×</button>
                </div>
                {% endfor %}
            </div>
            {% endif %}
    {% if request.user.profile_image %}
        <img src="{{ request.user.profile_image.url }}" alt="Profile Image" class="profile-image-preview">
    {% endif %}
    <!-- FIX: added id="profileForm" so confirmSave('profileForm') can find and submit it -->
    <form id="profileForm" method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <input type="text" name="full_name" placeholder="Full Name" value="{{ form_data.full_name|default:user.full_name|default:'' }}">
        <input type="tel" name="phone" placeholder="Phone Number" value="{{ form_data.phone|default:user.phone|default:'' }}">
        <input type="file" name="profile_image" accept="image/*">
        <div class="profile-field">
                <label>Gender</label>
                <div class="gender-options">
                    <label>
                        <input type="radio" name="gender" value="female"
                                {% if request.user.gender == "female" %}checked{% endif %}>
                        Female
                    </label>
                    <label>
                        <input type="radio" name="gender" value="male"
                                {% if request.user.gender == "male" %}checked{% endif %}>
                        Male
                    </label>
                </div>
            </div>
        <button type="button" onclick="confirmSave('profileForm')">Save</button>
    </form>
</div>

{% include "confirm_modal.html" %}
<script src="{% static 'js/ui-utils.js' %}"></script>
<script>
/* ── Auto-dismiss messages after 15 seconds ── */
    const msgContainer = document.getElementById("msgContainer");
    if (msgContainer) {
        setTimeout(() => {
            msgContainer.querySelectorAll(".message").forEach(msg => {
                msg.style.transition = "opacity 0.5s";
                msg.style.opacity = "0";
                setTimeout(() => msg.remove(), 500);
            });
        }, 15000);
    }
</script>
{% endblock %}
