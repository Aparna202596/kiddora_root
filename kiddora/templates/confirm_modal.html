<!-- CONFIRM MODAL -->
<div id="confirmModal" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.45);
    backdrop-filter: blur(3px);
    z-index: 99999;
    align-items: center;
    justify-content: center;
">
    <div class="confirm-box" style="
        background: #fff;
        border-radius: 14px;
        padding: 32px 28px 24px;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.18);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        animation: popIn 0.2s ease;
    ">
        <!-- Icon -->
        <div style="
            width: 56px; height: 56px;
            background: #fdecea;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px;
        ">⚠️</div>

        <!-- Message -->
        <p id="confirmMessage" style="
            margin: 0;
            font-size: 15px;
            font-weight: 500;
            color: #333;
            text-align: center;
            line-height: 1.6;
        "></p>

        <!-- Buttons -->
        <div style="display: flex; gap: 12px; width: 100%;">
            <button onclick="closeConfirmModal()" style="
                flex: 1;
                padding: 10px;
                border: 1px solid #ddd;
                border-radius: 8px;
                background: #f5f5f5;
                color: #555;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s;
            "
            onmouseover="this.style.background='#e8e8e8'"
            onmouseout="this.style.background='#f5f5f5'">
                Cancel
            </button>
            <button id="confirmActionBtn" style="
                flex: 1;
                padding: 10px;
                border: none;
                border-radius: 8px;
                background: #e53935;
                color: #fff;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: background 0.2s;
            "
            onmouseover="this.style.background='#c62828'"
            onmouseout="this.style.background='#e53935'">
                Yes, Confirm
            </button>
        </div>
    </div>
</div>

<style>
@keyframes popIn {
    from { transform: scale(0.85); opacity: 0; }
    to   { transform: scale(1);    opacity: 1; }
}
</style>
