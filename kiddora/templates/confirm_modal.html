<!-- ══════════════════════════════════════════
     KIDDORA ADMIN – CONFIRM MODAL
     Include once in base_admin.html
══════════════════════════════════════════ -->
<div id="confirmModal" style="
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(4px);
    z-index: 99999;
    align-items: center;
    justify-content: center;
">
    <div style="
        background: #fff;
        border-radius: 18px;
        padding: 36px 32px 28px;
        width: 90%;
        max-width: 420px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.18);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
        animation: kd-popIn 0.22s cubic-bezier(.34,1.56,.64,1);
    ">
        <!-- Warning Icon -->
        <div style="
            width: 60px; height: 60px;
            background: linear-gradient(135deg,#fff0f0,#fde4e4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 16px rgba(229,57,53,0.15);
        ">
            <i class="fa-solid fa-triangle-exclamation" style="font-size:24px; color:#e53935;"></i>
        </div>

        <!-- Title -->
        <p style="margin:0; font-size:17px; font-weight:700; color:#222; text-align:center;">
            Are you sure?
        </p>

        <!-- Dynamic Message -->
        <p id="confirmMessage" style="
            margin: -8px 0 0;
            font-size: 14px;
            font-weight: 500;
            color: #666;
            text-align: center;
            line-height: 1.65;
        ">This action cannot be undone.</p>

        <!-- Buttons -->
        <div style="display:flex; gap:10px; width:100%; margin-top:4px;">
            <button onclick="closeConfirmModal()" style="
                flex: 1;
                padding: 11px;
                border: 1.5px solid #e8e8e8;
                border-radius: 10px;
                background: #f9f9f9;
                color: #555;
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
                transition: all 0.18s ease;
                font-family: inherit;
            "
            onmouseover="this.style.background='#f0f0f0'; this.style.borderColor='#d0d0d0';"
            onmouseout="this.style.background='#f9f9f9'; this.style.borderColor='#e8e8e8';">
                Cancel
            </button>
            <button id="confirmActionBtn" style="
                flex: 1;
                padding: 11px;
                border: none;
                border-radius: 10px;
                background: linear-gradient(135deg, #ef5350, #e53935);
                color: #fff;
                font-size: 14px;
                font-weight: 700;
                cursor: pointer;
                transition: all 0.18s ease;
                font-family: inherit;
                box-shadow: 0 4px 14px rgba(229,57,53,0.3);
            "
            onmouseover="this.style.background='linear-gradient(135deg,#e53935,#c62828)'; this.style.transform='translateY(-1px)';"
            onmouseout="this.style.background='linear-gradient(135deg,#ef5350,#e53935)'; this.style.transform='translateY(0)';">
                <i class="fa-solid fa-check" style="margin-right:5px;"></i> Confirm
            </button>
        </div>
    </div>
</div>

<style>
@keyframes kd-popIn {
    from { transform: scale(0.8) translateY(20px); opacity: 0; }
    to   { transform: scale(1) translateY(0);      opacity: 1; }
}
</style>
